name: Pomodoro Tick

on:
  schedule:
    - cron: "*/1 * * * *"
  workflow_dispatch:

jobs:
  tick:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Tick Endpoint
        run: |
          curl -X GET "https://pomodoro-bot-dbmb.onrender.com/tick" \
          -H "User-Agent: GitHubActionsCron" \
          --silent --show-error
